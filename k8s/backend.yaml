apiVersion: v1
kind: Service
metadata:
  name: back-service
  namespace: app
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: uml-diagram-editor-api:k8s
          imagePullPolicy: IfNotPresent
          command: [gunicorn, app.main:app, -c, gunicorn_config.py, --workers, "2"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: back-config
            - secretRef:
                name: back-secret
          env:
            - name: DB__USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
