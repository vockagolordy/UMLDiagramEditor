apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: app
  annotations:
    cert-manager.io/cluster-issuer: uml-selfsigned
    cert-manager.io/subject-organizations: UML Diagram Editor Local
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api.uml.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: back-service
                port:
                  number: 8000
  tls:
    - hosts:
        - api.uml.test
      secretName: backend-tls
